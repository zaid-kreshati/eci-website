<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#104b34" />
    <meta
      name="description"
      content="ECI Cement manufactures and supplies quality cement for construction and infrastructure projects across Egypt."
    />
    <title>ECI Cement — Cement Manufacturing in Egypt</title>
    <script>
      try {
        var t = localStorage.getItem("eci-theme");
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
